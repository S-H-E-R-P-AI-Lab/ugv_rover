# Checks pull requests to main and pushes to main: installs everything on a fresh Ubuntu 22.04
# through scripts/setup_ubuntu.sh, builds the whole workspace and runs the tests of our own
# packages. Pull requests that only change docs skip it; pushes to main always run it.
# quick-check.yml runs the fast checks on every pull request. See docs/CI.md.
name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # A new push to a pull request replaces its running check; every commit on main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UGV_MODEL: ugv_rover
  LDLIDAR_MODEL: ld19
  # Packages we wrote and lint. Upstream and vendored packages are built but not linted.
  OWN_PACKAGES: ugv_webots

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out (without the Git LFS model files)
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh

      # The runner image ships LLVM's libunwind-NN-dev (with Clang), which conflicts with
      # Ubuntu's libunwind-dev that libgoogle-glog-dev (Cartographer) needs.
      - name: Remove the runner's conflicting libunwind packages
        run: |
          conflicting=$( (dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 'libunwind-*' || true) \
            | awk '$1 == "ii" && $2 ~ /^libunwind-[0-9]+-dev$/ {print $2}')
          if [ -n "$conflicting" ]; then
            echo "Removing: $conflicting"
            # shellcheck disable=SC2086
            sudo apt-get remove -y -qq $conflicting
          fi

      - name: Install ROS 2 Humble and the workspace dependencies
        run: bash scripts/setup_ubuntu.sh --no-build --no-upgrade --no-lfs

      - name: Check that rosdep resolves every dependency
        # cmake_modules is a ROS 1 key from rf2o_laser_odometry, harmless (docs/TROUBLESHOOTING.md).
        run: |
          rosdep install --from-paths src --ignore-src -y --rosdistro humble \
            --skip-keys cmake_modules

      - name: Install ccache
        run: sudo apt-get install -y -qq ccache

      # ccache is content addressed, so any earlier cache helps; the commit in the key saves
      # an updated cache after each run.
      - name: Restore the ccache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the workspace
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 1G
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache --zero-stats >/dev/null
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ccache --show-stats

      - name: Save the ccache
        if: always() && steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Test our packages
        run: |
          source install/setup.bash
          read -ra packages <<< "$OWN_PACKAGES"
          colcon test --packages-select "${packages[@]}" --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: |
            log/
            build/*/pytest.xml
            build/*/test_results/
          if-no-files-found: ignore
          retention-days: 14
