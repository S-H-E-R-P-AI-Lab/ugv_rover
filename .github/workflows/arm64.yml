# Nightly build on arm64 (the robot is a Jetson Orin Nano: arm64, Ubuntu 22.04, Humble),
# so architecture specific breakage shows up before it reaches the robot.
# Runs nightly, on demand, and on pull requests labelled "run-arm64". See docs/CI.md.
name: ARM64 build

on:
  schedule:
    # 12:30 UTC is 04:30 PST / 05:30 PDT, after the sim smoke test.
    - cron: '30 12 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

env:
  UGV_MODEL: ugv_rover
  LDLIDAR_MODEL: ld19
  OWN_PACKAGES: ugv_webots

jobs:
  build-arm64:
    name: Build and test (arm64)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-arm64') ||
      (github.event.action != 'labeled' &&
       contains(github.event.pull_request.labels.*.name, 'run-arm64'))
    runs-on: ubuntu-22.04-arm
    # Job level, so a run skipped by the label check never cancels a running one.
    concurrency:
      group: arm64-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    timeout-minutes: 120
    steps:
      - name: Check out (without the Git LFS model files)
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Install dependencies and build
        uses: ./.github/actions/ros-workspace

      - name: Test our packages
        run: |
          source install/setup.bash
          read -ra packages <<< "$OWN_PACKAGES"
          colcon test --packages-select "${packages[@]}" --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-logs
          path: |
            log/
            build/*/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
